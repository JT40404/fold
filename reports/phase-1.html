<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phase 1 report — Fold</title>
<meta name="description" content="Phase 1 report: structure prediction and molecular dynamics of KRAS G12D on two NVIDIA H100 GPUs.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--white:#fff;--grey:#EDEDEB;--muted:#6E6E6E;--lavender:#C4CBED;--coral:#E4544C;--pink:#E8B8D2;--blue:#3448C5;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--white);color:var(--black);font:400 17px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit} a:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
h1,h2,h3,p{margin:0}
.container{max-width:1080px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.tag{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
header.top{background:var(--black);color:var(--white);padding:calc(28px + env(safe-area-inset-top,0px)) 0 64px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:72px}
.brand{font-weight:800;font-stretch:125%;font-size:1.35rem;text-decoration:none}
.back{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;opacity:.8}
.back:hover{opacity:1}
h1{font-size:clamp(2.2rem,6vw,4.8rem);font-weight:600;font-stretch:110%;letter-spacing:-.03em;line-height:1;max-width:16ch;margin-top:14px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3)}
.chip.done{background:var(--white);color:var(--black);border-color:var(--white)}
main section{padding:56px 0;border-bottom:1px solid #DADADA}
main section:last-child{border-bottom:0}
.sec{display:grid;grid-template-columns:1fr 3fr;gap:32px}
@media (max-width:760px){.sec{grid-template-columns:1fr;gap:16px}}
h2{font-size:clamp(1.5rem,2.6vw,2rem);font-weight:600;font-stretch:106%;letter-spacing:-.02em;line-height:1.1;margin-bottom:16px}
.prose{max-width:66ch}
.prose p+p{margin-top:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:20px}
.kv div{background:var(--grey);border-radius:12px;padding:16px 18px}
.kv dt{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv dd{margin:6px 0 0;font-size:1.25rem;font-weight:600;font-stretch:106%}
.pending{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--pink);color:var(--black);vertical-align:middle}
.empty{color:var(--muted)}
.scroll{overflow-x:auto;margin-top:20px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.95rem}
th{text-align:left;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px 10px 0;border-bottom:1px solid var(--black)}
td{padding:12px 14px 12px 0;border-bottom:1px solid #E2E2E2;vertical-align:top}
td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem;overflow-wrap:anywhere}
ul.plain{margin:16px 0 0;padding-left:20px} ul.plain li+li{margin-top:8px}
.review{background:var(--lavender);border-radius:16px;padding:clamp(22px,3vw,34px)}
footer{background:var(--black);color:rgba(255,255,255,.6);font-size:.85rem;padding:32px 0 calc(40px + env(safe-area-inset-bottom,0px))}

.finding{border-top:1px solid var(--black);padding:22px 0}
.finding+.finding{border-top-color:#DADADA}
.finding h3{font-size:1.3rem;font-weight:600;font-stretch:106%;line-height:1.15}
.finding p{margin-top:10px;max-width:68ch}
.finding .src{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.finding .matters{background:var(--grey);border-radius:12px;padding:14px 18px;font-size:.95rem}
ol.steps{margin:0;padding-left:22px;max-width:68ch}
ol.steps li{padding:10px 0;border-bottom:1px solid #E2E2E2}
ol.steps li:last-child{border-bottom:0}
ol.refs{margin:0;padding-left:22px;max-width:76ch;font-size:.93rem}
ol.refs li{padding:9px 0;border-bottom:1px solid #E2E2E2}
ol.refs li:last-child{border-bottom:0}
.sub-note{display:block;margin-top:6px;font-size:.8rem;font-weight:400;color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <div class="container">
    <div class="bar"><a class="brand" href="/">FOLD</a><a class="back" href="/#reports">All reports</a></div>
    <p class="tag" id="r-kicker">Phase report</p>
    <h1 id="r-title">—</h1>
    <div class="meta" id="r-meta"></div>
  </div>
</header>

<main class="container" id="report"></main>

<footer><div class="container">Research data, not medical advice. Results from simulations have not been tested in a lab.</div></footer>

<!--
  ================= REPORT DATA =================
  Everything on this page comes from the JSON below.
  Leave a value as "" or null and the page shows "Pending data" in its place.
-->
<script type="application/json" id="report-data">
{
  "phase": 1,
  "title": "KRAS G12D: what the published research already shows",
  "kind": "Literature review and protocol",
  "status": "Completed",
  "period": { "start": "", "end": "" },

  "summary": "Phase 1 is groundwork, not simulation. Before spending GPU hours on KRAS G12D, we read what has already been published about it: how the mutation changes the protein, which structures exist to start from, and what has already been tried against it.\n\nThe short version: KRAS G12D is the most common KRAS mutation in cancer. The mutation leaves the protein stuck in its active state, and for decades its surface was considered too smooth to drug. That changed in 2021 and 2022, when a pocket near switch II was used to build MRTX1133, a compound that binds KRAS G12D very tightly and shrank tumours in mice. Separately, molecular dynamics studies showed exactly which parts of the protein move differently after the mutation, especially switch II.\n\nThose two findings set up our own work. There are high-resolution crystal structures to start from, a known pocket worth watching, and published simulation results we can check our own runs against. Phase 2 runs the simulations.",

  "target": {
    "name": "KRAS G12D",
    "uniprot": "P01116",
    "gene": "KRAS",
    "why": "KRAS is the most frequently mutated oncoprotein in human cancer. Position 12 accounts for the large majority of its cancer mutations, and glycine-to-aspartate (G12D) is the single most common of them. The swap puts a bulkier, negatively charged side chain into the active site, which blocks the protein from switching itself off. Stuck in its active state, it keeps signalling for cells to grow."
  },

  "regions": [
    { "name": "P-loop", "residues": "10–17", "role": "Holds the phosphate groups of the bound nucleotide. Residue 12, the mutated position, sits here." },
    { "name": "Switch I", "residues": "25–40", "role": "Moves between shapes depending on which nucleotide is bound, and controls binding to partner proteins." },
    { "name": "Switch II", "residues": "60–74", "role": "The region most changed by the mutation, and where the pocket used by current inhibitors opens." }
  ],

  "findings": [
    {
      "headline": "The mutation unsettles switch II",
      "detail": "Microsecond-scale all-atom simulations of wild-type and G12D KRAS, in both the active (GTP-bound) and inactive (GDP-bound) forms, found that the loop residues of switch II fluctuate more in the active mutant. A salt bridge between E63 and R68 that holds switch II together in the active wild-type protein does not form in the active mutant. The mutation also shifts switch II and the α3 helix into a single dominant arrangement rather than the two the wild-type visits.",
      "source": "Vatansever, Erman & Gümüş (2019)",
      "why_it_matters": "This tells us which part of the protein to watch in our own runs, and gives us published behaviour to check our simulations against before trusting anything new they show."
    },
    {
      "headline": "The pockets only open sometimes",
      "detail": "The main binding sites on KRAS, including the switch-2 pocket, are described as cryptic: they are not open in the protein's most common resting shape and appear only briefly as it moves.",
      "source": "Dynamic conformational equilibria in the active states of KRAS and NRAS (2025)",
      "why_it_matters": "This is the core reason this project runs simulations instead of docking against a single static structure. A pocket that only exists part of the time is invisible to a still picture."
    },
    {
      "headline": "A hard target turned out to be druggable",
      "detail": "MRTX1133 was built through repeated rounds of structure-guided design to fill the switch-2 pocket. It binds GDP-loaded KRAS G12D with a reported dissociation constant near 0.2 pM and roughly 700-fold selectivity over wild-type KRAS, and produced tumour shrinkage of 30% or more in a subset of KRAS G12D mouse models, including 8 of 11 pancreatic cancer models.",
      "source": "Wang et al. (2022); Hallin et al. (2022)",
      "why_it_matters": "It proves the target is reachable, and gives us a reference compound. Any docking protocol we build should rank MRTX1133 highly against this pocket, or the protocol is wrong."
    },
    {
      "headline": "We know what binding looks like",
      "detail": "The MRTX1133 work deposited six crystal structures of KRAS G12D with bound compounds, the sharpest at 1.27 Å. A later study found that MRTX1133 binding pushes KRAS G12D fully into its inactive shape and blocks its partner protein from attaching.",
      "source": "PDB 7RPZ, 7RT1–7RT5; RSC Chem. Biol. (2025)",
      "why_it_matters": "These give us validated starting structures, and a known binding pose to measure our predicted poses against."
    }
  ],

  "structures": [
    { "pdb": "7RT1", "resolution": "1.27 Å", "method": "X-ray diffraction", "contents": "KRAS G12D with GDP, magnesium and an inhibitor from the MRTX1133 series", "use": "Primary starting structure for simulations" },
    { "pdb": "7RT4", "resolution": "2.10 Å", "method": "X-ray diffraction", "contents": "KRAS G12D with a different compound of the same series", "use": "Comparison of pocket shape across compounds" },
    { "pdb": "7RPZ, 7RT2, 7RT3, 7RT5", "resolution": "Various", "method": "X-ray diffraction", "contents": "Further KRAS G12D complexes from the same study", "use": "Cross-checking how far the pocket can open" }
  ],

  "protocol": [
    { "step": "Starting structure", "plan": "Use the 1.27 Å crystal structure (7RT1) with the bound compound removed, rather than a predicted model, since an experimental structure of this quality already exists." },
    { "step": "Prediction as a check", "plan": "Also build the structure from sequence and compare it to the crystal structure. If prediction is close here, we have more confidence using it for targets with no crystal structure." },
    { "step": "Simulation", "plan": "Run replicate all-atom simulations of the GDP-bound protein, long enough to see switch II move, following the published setups that produced the findings above." },
    { "step": "What we measure", "plan": "Per-residue fluctuations, the E63–R68 salt bridge, and whether the switch-2 pocket opens. These are the quantities earlier studies already reported, so our numbers can be compared to theirs." },
    { "step": "Docking", "plan": "Screen compounds against several shapes taken from the simulation rather than one. MRTX1133 is included as a positive control; if it does not score well, the protocol gets fixed before any results are published." }
  ],

  "hardware": [
    { "model": "NVIDIA H100 80GB", "count": 2, "note": "Online and running Phase 2 simulations" }
  ],

  "claude_review": "This phase produced no simulation results, and the report should not be read as if it did. What it produced is a decision about where to point the hardware, and that decision is now backed by published work rather than guesswork.\n\nThree things in the literature shaped the plan. The switch-2 pocket is cryptic, so screening against a single static structure would likely miss it; that justifies spending GPU time on dynamics before docking. Earlier simulations already reported specific, checkable numbers for how switch II behaves after the mutation, which gives Phase 2 something to be measured against instead of producing results nobody can verify. And MRTX1133 gives a positive control, which matters more than it sounds: a docking protocol that cannot rank a known picomolar binder near the top is not ready to rank anything else.\n\nThe honest limitation is that KRAS G12D is a crowded field with well-funded teams and a compound already in trials. Finding something genuinely new here is unlikely. It was chosen as the first target because the published record is deep enough to tell quickly whether our pipeline works at all. A pipeline that reproduces known results on a well-studied target is worth more than novel-looking results on one where nothing can be checked.",

  "limitations": [
    "No simulations were run in this phase. Every number in this report comes from previously published work by other researchers, cited alongside each finding.",
    "KRAS G12D is already the subject of extensive pharmaceutical research, including a compound in clinical trials. This project is not competing with that work.",
    "Published findings were selected for relevance to the planned protocol. This is not a systematic review of the KRAS literature.",
    "Nothing here has been tested in a lab by this project. Simulations find candidates, not cures."
  ],

  "sources": [
    { "cite": "Vatansever, S., Erman, B. & Gümüş, Z. H. (2019). Oncogenic G12D mutation alters local conformations and dynamics of K-Ras. Scientific Reports 9, 11730.", "url": "https://doi.org/10.1038/s41598-019-48029-z" },
    { "cite": "Wang, X. et al. (2022). Identification of MRTX1133, a Noncovalent, Potent, and Selective KRAS G12D Inhibitor. Journal of Medicinal Chemistry 65(4), 3123–3133.", "url": "https://doi.org/10.1021/acs.jmedchem.1c01688" },
    { "cite": "Hallin, J. et al. (2022). Anti-tumor efficacy of a potent and selective non-covalent KRAS G12D inhibitor. Nature Medicine 28(10), 2171–2182.", "url": "https://doi.org/10.1038/s41591-022-02007-7" },
    { "cite": "Dynamic conformational equilibria in the active states of KRAS and NRAS (2025). RSC Chemical Biology.", "url": "https://doi.org/10.1039/d4cb00233d" },
    { "cite": "Protein Data Bank entry 7RT1: KRAS G12D crystal structure at 1.27 Å.", "url": "https://www.rcsb.org/structure/7RT1" },
    { "cite": "Qiu, X., Li, H., Ver Steeg, G. & Godzik, A. (2024). Advances in AI for Protein Structure Prediction: Implications for Cancer Drug Discovery and Development. Biomolecules 14(3), 339.", "url": "https://www.mdpi.com/2218-273X/14/3/339" }
  ]
}
</script>

<script>
const R = JSON.parse(document.getElementById("report-data").textContent);
const esc = v => String(v).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const para = t => t.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join("");
const section = (label, title, body) => `<section><div class="sec"><p class="tag">${label}</p><div><h2>${title}</h2>${body}</div></div></section>`;

document.title = `Phase ${R.phase} report: ${R.title} — Fold`;
document.getElementById("r-kicker").textContent = `Phase ${R.phase} report`;
document.getElementById("r-title").textContent = R.title;
const dates = R.period.start ? `${R.period.start}${R.period.end ? " to " + R.period.end : ""}` : "";
document.getElementById("r-meta").innerHTML =
  `<span class="chip done">${esc(R.status)}</span><span class="chip">${esc(R.kind)}</span>` + (dates ? `<span class="chip">${esc(dates)}</span>` : "");

let html = "";

html += section("Summary", "What this phase did", `<div class="prose">${para(R.summary)}</div>`);

html += section("Target", esc(R.target.name), `<div class="prose"><p>${esc(R.target.why)}</p></div>` +
  `<dl class="kv"><div><dt>Gene</dt><dd>${esc(R.target.gene)}</dd></div><div><dt>UniProt ID</dt><dd>${esc(R.target.uniprot)}</dd></div></dl>` +
  `<div class="scroll"><table><thead><tr><th>Region</th><th>Residues</th><th>What it does</th></tr></thead><tbody>` +
  R.regions.map(r => `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.residues)}</td><td>${esc(r.role)}</td></tr>`).join("") +
  `</tbody></table></div>`);

html += section("Findings", "What the published work shows",
  R.findings.map(f => `<article class="finding">
      <h3>${esc(f.headline)}</h3>
      <p>${esc(f.detail)}</p>
      <p class="src">${esc(f.source)}</p>
      <p class="matters"><b>Why it matters here.</b> ${esc(f.why_it_matters)}</p>
    </article>`).join(""));

html += section("Structures", "Starting points we can use",
  `<div class="scroll"><table><thead><tr><th>PDB</th><th>Resolution</th><th>Method</th><th>Contents</th><th>Use</th></tr></thead><tbody>` +
  R.structures.map(x => `<tr><td><b>${esc(x.pdb)}</b></td><td>${esc(x.resolution)}</td><td>${esc(x.method)}</td><td>${esc(x.contents)}</td><td>${esc(x.use)}</td></tr>`).join("") +
  `</tbody></table></div>`);

html += section("Protocol", "What Phase 2 will run",
  `<ol class="steps">` + R.protocol.map(p => `<li><b>${esc(p.step)}.</b> ${esc(p.plan)}</li>`).join("") + `</ol>` +
  `<dl class="kv">` + R.hardware.map(h => `<div><dt>Hardware</dt><dd>${h.count} × ${esc(h.model)}<span class="sub-note">${esc(h.note)}</span></dd></div>`).join("") + `</dl>`);

html += section("Review", "Claude's review", `<div class="review prose">${para(R.claude_review)}</div>`);

html += section("Limits", "What this report doesn't show",
  `<ul class="plain prose">${R.limitations.map(l => `<li>${esc(l)}</li>`).join("")}</ul>`);

html += section("Sources", "References",
  `<ol class="refs">${R.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cite)}</a></li>`).join("")}</ol>`);

document.getElementById("report").innerHTML = html;
</script>
</body>
</html>
